
services:
  backend:
    image: tanhdoan/mern-backend:1.0
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://admin:6666@cluster0.xkpzavb.mongodb.net/student_db?retryWrites=true&w=majority
      - mern-network

  frontend:
    image: tanhdoan/mern-frontend:1.0
    ports:
      - "3000:80"
    #volumes:
    #  - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge