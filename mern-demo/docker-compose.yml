
services:
  # Câu 81: Khai báo Service backend (sử dụng thuộc tính services và build)
  backend:
    build: ./server
    container_name: mern-backend-container
    # Câu 83: Cấu hình Port cho Service backend (5000:5000)
    ports:
      - "5000:5000"
    # Câu 85: Cấu hình biến môi trường MONGODB_URI cho Backend
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://admin:6666@cluster0.xkpzavb.mongodb.net/?appName=Cluster0
    restart: always

  # Câu 82: Khai báo Service frontend (sử dụng thuộc tính services và build)
  frontend:
    build: ./client
    container_name: mern-frontend-container
    # Câu 84: Cấu hình Port cho Service frontend (3000:80)
    ports:
      - "3000:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: always
